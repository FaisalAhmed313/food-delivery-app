    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
        <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
        <title>Document</title>
        <script>

            function bodyload(id) {
                fetch(`https://fakestoreapi.com/products/${id}`)
                .then(function(response){
                    return response.json()
                })
                .then(function(product){

                document.getElementById("title").innerHTML = product.title;
                document.getElementById("imgposter").src = product.image;
                

                })
            }
            let productId = 1;
            function loadProducts(){

            productId++
            document.getElementById("progress").value = productId 
            fetch(`https://fakestoreapi.com/products/${productId}`)
            .then(function(response){
                return response.json()
            })
            .then(function(product){
                
            document.getElementById("title").innerHTML = product.title;
            document.getElementById("imgposter").src = product.image;
                
            })
            }
            var timer;
            function Playclick() {
                timer= setInterval(loadProducts,2000)
                document.getElementById("lblStatus").innerHTML = "[Slide Show - running]";
            }
            function Pauseclick(){
                clearInterval(timer)
                 document.getElementById("lblStatus").innerHTML = "[Slide Show - Paused]";
            }

            function RangeChange(){
              bodyload(document.getElementById("progress").value);
         }
        </script>
    </head>
    <body  onload="bodyload(1)">
        <div class="card">
            <div class="card-header">
                <p id="title"></p>
                <p id="lblStatus"></p>
            </div>
            <div class="card-body row">
            <div class="col-1  p-2 d-flex flex-column justify-content-center">
                <button class="btn bi bi-chevron-left"></button>
            </div>
            <div class="col-10">
                <img id="imgposter" width="100%" height="350">
            </div>
            <div class="col-1 p-2 d-flex flex-column justify-content-center">
            <button class="btn bi bi-chevron-right"></button>
            </div>

            </div>
            <card class="card-footer">
                <div>
                <input type="range" onchange="RangeChange()" id="progress" min="1" max="20" value="1" class="form-range">
                </div>
                <div>
                <button class="btn btn-success bi bi-play" onclick="Playclick()"></button>
                <button class="btn btn-warning bi bi-pause" onclick="Pauseclick()"></button>
            </div>
            </card>
            
        </div>
    </body>
    </html>
