<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>Document</title>
    <style>

 .accordion{
            margin-top: -450px;
        }
        
        dd {
            background-color: bisque;
        }
        
    input {
    width: 100%;
    height: 40px;
    border: 2px solid green;
    border-radius: 5px;
    padding: 10px;
    background-color: white;
}


        
    </style>
    <script>
        let mealname = "";
        let mealcost = 0;

        
        function placeOrder(){

         document.getElementById("lblname").innerHTML = document.getElementById("txtname").value
         document.getElementById("lblnumber").innerHTML = document.getElementById("txtnumber").value

        optburger = document.getElementById("optBurger")
        optshuwarma = document.getElementById("optShuwarma")

        if(optburger.checked){
            mealname = optburger.value;
            mealcost = 120;

        }
        if(optshuwarma.checked){
            mealname = optshuwarma.value;
            mealcost = 100;

        }


        document.getElementById("lblmeal").innerHTML = mealname
        document.getElementById("lbltotal").innerHTML = mealcost.toLocaleString(`en-in`, {style : "currency", currency : "INR"})


        

        }
    </script>
</head>
<body>
    <img src="/public/images/food-delivery-2.jpg" width="1400px" height="800" alt="">
    <div class="accordion"  id="kfc">
        <div class="accordion-item">
            <div class="accordion-header">
                <button class="btn btn-danger w-100" data-bs-target="#customer" data-bs-toggle="collapse">Customer details</button>

            </div>
            <div class="accordion-collapse collapse" id="customer" data-bs-parent="#kfc" >
                <div class="accordion-body">
                    <dl>
                        <dt>User Name</dt>
                        <dd><input type="text" id="txtname"  ></dd>
                        <dt>Mobile no:</dt>
                        <dd><input type="text" id="txtnumber" ></dd>
                    </dl>

                </div>

            </div>

        </div>

        <div class="accordion-item">
            <div class="accordion-header">
                <button class="btn btn-danger w-100 mt-2" data-bs-toggle="collapse" data-bs-target="#meal">Select your meal</button>

            </div>
            <div class="accordion-collapse collapse" id="meal">

                <div class="accordion-body">
                    <div class="row">
                        <div class="col-6">
                             <h3>OMG Burger</h3>
                            <img src="/public/images/food.jpg" width="200" height="200">
                            <div>
                                <input type="radio" id="optBurger" value="Burger" class="form-check-input" name="food">
                            <label class="form-label text-center">120/-</label>
                            </div>
                        </div>
                        <div class="col-6">
                             <h3>Shuwarma</h3>
                           <img src="/public/images/Shawarma-7-1022x1536.jpg" width="200" height="200">
                           <div>
                            <input type="radio" id="optShuwarma" value="Shuwarma" class="form-check-input" name="food">
                           <label class="form-label text-center">100/-</label>
                           </div>
                        </div>

                    </div>
                </div>

            </div>

        </div>

        <div>

        </div>

    </div>

    <div>
       <button onclick="placeOrder()" data-bs-target="#details" data-bs-toggle="modal" class="btn btn-warning w-100 mt-2">Place Order</button>
       
       <div class="modal" id="details">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Your Bill Summary</h3>
                </div>
                <div class="modal-body">
                    <dl>
                        <dt>Customer Name:</dt>
                        <dd id="lblname"></dd>
                        <dt>Mobile no:</dt>
                        <dd id="lblnumber"></dd>
                        <dt>Meal:</dt>
                        <dd id="lblmeal"></dd>
                        <dt>Addon:</dt>
                        <dd id="lbladon"></dd>
                        <dt>Total:</dt>
                        <dd id="lbltotal"></dd>
                    </dl>
                </div>
            </div>

        </div>

       </div>
    </div>
    <script src="/node_modules/jquery/dist/jquery.js"></script>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>
</html>
